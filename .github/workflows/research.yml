# Expensive research runs. Manual only (maintainers), never on pull requests.
# Regenerates certificates and outputs in the runner, checks that the committed certificates are
# reproduced, and uploads everything as an artifact. It never writes to the repository.
name: research
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Install locked environment
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .
      - name: Keep the committed certificates for comparison
        run: cp -r certificates committed-certificates
      - name: Regenerate certificates and outputs
        run: |
          python experiments/pair_correlation/baselines/run_baseline.py
          python experiments/pair_correlation/proven_cap/run_proven_cap.py
          python experiments/pair_correlation/signed_kernels/certify_sign_only.py
          python experiments/pair_correlation/sensitivity/reproduce_caps.py
          python tests/data/make_historical_failures.py
      - name: Verification report for the regenerated certificates
        run: python tools/verify_certificates.py --report outputs/verification-report.json
      - name: Committed certificates must be reproduced (mathematical content)
        run: python tools/compare_certificates.py committed-certificates certificates
      - name: Re-run the 2026-11-23 audit scripts (only the documented failure is allowed)
        run: |
          mkdir -p outputs/audit
          status=0
          for s in audits/2026-11-23-pair-correlation-audit/scripts/check*.py; do
            name="$(basename "$s" .py)"
            rc=0
            python "$s" > "outputs/audit/$name.txt" 2>&1 || rc=$?
            if [ "$name" = "check3_exact" ]; then
              # Documented in the audit report: part (3) ends with a cvxpy SolverError.
              if [ "$rc" -eq 0 ] || ! grep -q "SolverError" "outputs/audit/$name.txt"; then
                echo "::error::$name did not fail with the documented SolverError (exit $rc)"; status=1
              fi
            elif [ "$rc" -ne 0 ]; then
              echo "::error::$name exited with status $rc"; status=1
            fi
          done
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: research-outputs
          path: |
            certificates/
            outputs/
            tests/data/historical_failures.json
          retention-days: 30
