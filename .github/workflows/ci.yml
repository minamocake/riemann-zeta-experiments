# Fast checks for every pull request and for pushes to main.
# Passing checks are software checks, not mathematical proofs.
name: checks
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read            # read-only token; no job in this workflow writes to the repository

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
      - name: Install locked environment
        run: |
          python -m pip install -r requirements-lock.txt
          python -m pip install --no-deps -e .
      - name: Ruff
        run: python -m ruff check .
      - name: English-only check
        run: python tools/check_english_only.py
      - name: Certificates (two independent exact verifiers; arithmetic only, not a proof)
        run: python tools/verify_certificates.py
      - name: Registry consistency and generated table
        run: python tools/check_registry.py --check
      - name: Tests (software checks, not mathematical proofs)
        run: python -m pytest
