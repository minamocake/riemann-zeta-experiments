- id: neg-signonly-degeneracy
  kind: negative-result
  title: Sign-only mode cannot exceed the classical support-in-[-1,1] problem in the box family
  computation: reproduced
  mathematical_status: proof-pending
  argument:
  - docs/derivations/sign-only-degeneracy.md
  open_issues: []
  reviews: []
  evidence:
  - certificates/pc-legacy-signonly-A1.5.json
  - certificates/pc-legacy-signonly-A2.0.json
  tests:
  - tests/test_signonly_degeneracy.py
  summary: >
    R <= 0 on [1, A] forces zero weight on every box wider than 1, so the signed extension with larger A reduces
    to the classical problem and is bounded by Montgomery-Taylor (0.6725). The decrease of the legacy sign-only
    P with A is an artifact of fewer boxes of width <= 1.
- id: neg-refinement-strengthens-hypothesis
  kind: negative-result
  title: Adaptive bin refinement with caps proportional to width strengthens the hypothesis
  computation: reproduced
  mathematical_status: proof-pending
  argument:
  - docs/derivations/refinement.md
  open_issues: []
  reviews: []
  evidence:
  - pc-legacy-positive-A2.0-stage0
  - pc-legacy-positive-A2.0-stage2
  - pc-positive-A2-refinement-limit
  summary: The P increase across refinement stages reflects a stronger assumption, not a better method.
- id: neg-rank-one-not-global
  kind: negative-result
  title: Rank-one signed optimum is not the best PSD mixture at A=2, scale 8
  computation: reproduced
  mathematical_status: conjectural
  open_issues: []
  reviews: []
  evidence:
  - pc-legacy-caps-A2.0-scale8
  - pc-psd-caps-A2-scale8
  summary: Restricting to f = |H|^2 with a single H loses 0.03 percentage points there.
- id: neg-no-improvement-over-literature
  kind: negative-result
  title: No RH-only value in this repository exceeds the pair-correlation benchmark
  computation: reproduced
  mathematical_status: conjectural
  open_issues: []
  reviews: []
  evidence:
  - pc-baseline-A1
  - pc-legacy-signonly-A2.0
  - pc-provencap-A2
  summary: >-
    Best RH-only value here is 0.67763 (with an unreviewed lemma), below the pair-correlation benchmark 0.6792
    (Chirre-Goncalves-de Laat 2020).
