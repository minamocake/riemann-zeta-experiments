# Result registry. One entry per recorded number or finding.
#
# Three independent dimensions are recorded for every result:
#   computation:          exploratory | reproduced | numerically-certified
#   mathematical_status:  conjectural | proof-pending | independently-reviewed | proven
#   assumptions:          ids from results/assumptions.yaml (their status lives there)
# mathematical_status is set BY HAND and is never derived or upgraded by tools. The checker only
# rejects statuses that overstate the evidence: 'independently-reviewed' and 'proven' require a
# recorded human review (AI audits and passing tests do not count); 'proven' also needs
# 'accepted: true'. See docs/status-policy.md.
#
# Migration from the two-axis v0.1 draft (values unchanged): exact-certificate -> numerically-certified,
# numerical-reproduced -> reproduced, numerical-single -> exploratory; argument_status -> mathematical_status.
# The 2026-11-23 audit was performed by an AI system and is recorded as evidence, not as a review.
#
# quantity P: lower bound for liminf N_s(T)/N(T) (proportion of simple zeros), from N* <= (2 - P) N.

schema: riemann-research/registry/v1
literature:
  montgomery-taylor:
    value: 0.6725
    description: 'Optimal constant for Fourier support in [-1,1]: N* <= 1.3275 N (Montgomery-Taylor; Cheer-Goldston).'
  chirre-goncalves-de-laat-2020:
    value: 0.6792
    description: >-
      Pair-correlation benchmark: N* < 1.3208 N under RH via semidefinite programming with the sign
      condition f^ <= 0 for |x| >= 1. Best published value we know of from Montgomery's pair-correlation
      method; not the best known proportion of simple zeros under RH by all methods.
    reference: A. Chirre, F. Goncalves, D. de Laat, Adv. Math. 361 (2020) 106926; arXiv:1810.08843.
